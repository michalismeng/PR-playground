name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # fetch-tags: true
      - name: Export image version
        if: github.event_name == 'push'
        env:
          ENVIRONMENT: staging
        run: echo "$(make version)"


  # Detect which parts of the codebase changed and derive build flags
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-build: ${{ steps.flags.outputs.should-build }}
      should-publish: ${{ steps.flags.outputs.should-publish }}
      should-e2e: ${{ steps.flags.outputs.should-e2e }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # zizmor: ignore[artipacked]

      # - name: Filter changes testing
      #   shell: bash
      #   id: filter
      #   # Hardcode change to portal == true for now
      #   run: |
      #     echo "portal=true" >> "$GITHUB_OUTPUT"
      #     echo "mcp=false" >> "$GITHUB_OUTPUT"
      #     echo "server=false" >> "$GITHUB_OUTPUT"

      # https://github.com/dorny/paths-filter
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            portal:
              - 'crates/portal/**'
              - 'crates/portal-auth/**'
              - 'crates/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            mcp:
              - 'crates/mcp/**'
              - 'crates/portal-auth/**'
              - 'crates/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            server:
              - 'crates/server/**'
              - 'crates/portal/**'
              - 'crates/portal-auth/**'
              - 'crates/mcp/**'
              - 'crates/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Compute flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          code_changed=false
          [[ "${{ steps.filter.outputs.changes }}" != "[]" ]] && code_changed=true

          should_publish=false
          [[ "$EVENT" == "push" && ("$REF" == "refs/heads/dev" || "$REF" =~ ^refs/tags/v) ]] && should_publish=true

          should_build=false
          [[ "$code_changed" == "true" || "$should_publish" == "true" ]] && should_build=true

          should_e2e=$code_changed

          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "should-e2e=$should_e2e" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # main branch builds with production feature flags
      # All other branches (dev, PRs to dev, feature branches) build without flags
      - name: Determine build variant
        id: variant
        env:
          GH_REF: ${{ github.ref }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GH_REF" == "refs/heads/main" || \
                "$GH_BASE_REF" == "main" || \
                "$GH_REF" =~ ^refs/tags/v ]]; then
            lib="hydrate"
            bin="ssr,invite-only-signup"
            srv="invite-only-signup"
            {
              echo "environment=production"
              echo "leptos-flags=--lib-features=$lib --bin-features=$bin"
              echo "server-features=--features=$srv"
            } >> "$GITHUB_OUTPUT"
          else
            lib="hydrate"
            bin="ssr,invite-only-signup"
            srv="invite-only-signup"
            {
              echo "environment=staging"
              echo "leptos-flags=--lib-features=$lib --bin-features=$bin"
              echo "server-features=--features=$srv"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Building
        env:
          GH_REF: ${{ github.ref }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Building with features: ${{ steps.variant.outputs.leptos-flags }} and server features: ${{ steps.variant.outputs.server-features }}"
          echo "Environment: ${{ steps.variant.outputs.environment }}"
          echo "GH_REF: $GH_REF"
          echo "GH_BASE_REF: $GH_BASE_REF"
          sleep 10

      - name: Publishing
        if: needs.detect-changes.outputs.should-publish == 'true'
        run: echo "Publishing artifacts..."

      - name: Building E2E
        if: needs.detect-changes.outputs.should-e2e == 'true'
        shell: bash
        run: echo "Building E2E variant if needed..."

  e2e-tests:
    name: E2E Tests
    needs: [build, detect-changes]
    if: always() && needs.build.result == 'success' && needs.detect-changes.outputs.should-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Export image version
        if: github.event_name == 'push'
        env:
          ENVIRONMENT: staging
        run: echo "$(make version)"

      - name: Run E2E tests
        working-directory: crates/portal/end2end
        shell: bash
        run: echo "Running E2E tests... && sleep 50"

name: Deploy to DigitalOcean (Blue/Green) - Reusable

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (staging or production)
        required: true
        type: string
      ref:
        description: The ref to deploy (commit sha, tag, or branch)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve-ref:
    name: Resolve Ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit-sha: ${{ steps.resolve.outputs.commit-sha }}
    steps:
      - name: Resolve ref to commit SHA
        id: resolve
        # https://github.com/actions/github-script
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_REF: ${{ inputs.ref }}
        with:
          script: |
            const inputRef = process.env.INPUT_REF;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: inputRef,
            });
            console.log(`Resolved ref '${inputRef}' to commit '${commit.sha}'`);
            core.setOutput('commit-sha', commit.sha);

  check-gates:
    name: Check Deployment Gates
    runs-on: ubuntu-latest
    needs: [resolve-ref]
    timeout-minutes: 10
    steps:
      - name: Check CI gates
        id: check
        # https://github.com/actions/github-script
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const commitSha = "${{ needs.resolve-ref.outputs.commit-sha }}";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: commitSha,
              status: 'completed',
              per_page: 1,
            });
            const ciRun = runs.data.workflow_runs.find(r => r.conclusion === 'success');
            if (!ciRun) {
              core.setFailed(`No successful CI run found for commit '${commitSha}'`);
              return;
            }
            console.log(`Using CI run ${ciRun.html_url} for commit '${commitSha}'`);

      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-ref.outputs.commit-sha }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [resolve-ref, check-gates]
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-ref.outputs.commit-sha }}

      - name: Print inputs and commit info
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Ref: ${{ inputs.ref }}"
          echo "Commit SHA: ${{ needs.resolve-ref.outputs.commit-sha }}"


name: Deploy to DigitalOcean Production (Blue/Green)

# Automates the Ansible blue/green deployment described in deploy/README.md.

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI"]
    branches: ["v*"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: The ref to check out and deploy (commit sha, tag, branch)
        required: true
        type: string

concurrency:
  group: deployments-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Debug print all github.event variables
      shell: bash
      run: echo '${{ toJSON(github.event.workflow_run) }}'

  deploy:
    name: Deploy to Production
    uses: ./.github/workflows/_deploy-do.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_branch || inputs.ref }}
    secrets: inherit

name: Deploy to DigitalOcean Production (Blue/Green)

# Automates the Ansible blue/green deployment described in deploy/README.md.

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI"]
    branches: ["v*"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: The ref to check out and deploy (commit sha, tag, branch)
        required: false
        default: main
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Debug print all github.event variables
      shell: bash
      run: echo '${{ toJSON(github.event.workflow) }}'

  deploy:
    name: Deploy to Production
    # TODO: Remove the startWith for now
    # if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_deploy-do.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_branch || inputs.ref || 'main' }}
    secrets: inherit
